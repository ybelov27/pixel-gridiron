<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gridiron">
<meta name="theme-color" content="#0b0d1c">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Pixel Gridiron</title>
<link rel="icon" href="icons/icon-192.png">
<style>
  html,body{margin:0;height:100%;background:#0b0d1c;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
  body{display:flex;align-items:center;justify-content:center;height:100vh;height:100dvh}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;background:#0b0d1c;touch-action:none;outline:none}
  #file{display:none}
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<input id="file" type="file" accept=".json,application/json">
<script type="module" src="src/main.js"></script>
